<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CrossWord Quest - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#f1f5f9',
              primary: '#3b5998', // Adjusted to match the image's blue tone
              dark: '#1e293b',
              gray: '#f8fafc',
              border: '#e2e8f0',
              text: '#334155'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-8">
<!-- BEGIN: MainContainer -->
<main class="bg-white rounded-3xl shadow-xl overflow-hidden w-full max-w-5xl flex flex-col md:flex-row min-h-[600px]">
<!-- BEGIN: LeftPane Branding -->
<section class="bg-slate-50 w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between" data-purpose="branding-pane">
<!-- Header / Logo -->
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 bg-brand-primary rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
<svg class="lucide lucide-grid-2x2" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><rect height="18" rx="2" width="18" x="3" y="3"></rect><path d="M3 12h18"></path><path d="M12 3v18"></path></svg>
</div>
<h1 class="text-xl font-bold text-slate-800 tracking-tight">CrossWord Quest</h1>
</div>
<!-- Main Copy -->
<div class="mb-12">
<h2 class="text-4xl font-bold text-slate-800 leading-tight mb-4">
          Challenge your mind <br/>
          with <span class="text-brand-primary">crossword</span> <br/>
          puzzles
        </h2>
<p class="text-slate-500 text-sm leading-relaxed max-w-md">
          Unlock your vocabulary potential. Join thousands of grandmasters in the ultimate daily intellectual adventure.
        </p>
</div>
<!-- Graphic Placeholder (Simulated with CSS) -->
<div class="flex-grow flex items-center justify-center relative mb-8 perspective-[1000px]">
<div class="grid grid-cols-4 gap-2 p-3 bg-white rounded-xl shadow-lg border border-slate-100 transform -rotate-y-12 rotate-x-12 scale-110 opacity-90 transition-transform hover:rotate-0 duration-500">
<!-- Simulating the crossword grid from the image -->
<div class="w-12 h-12 bg-brand-primary rounded-md flex items-center justify-center text-white font-bold text-lg shadow-sm">W</div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-purple-700 rounded-md flex items-center justify-center text-white font-bold text-lg shadow-sm">Q</div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-blue-500 rounded-md flex items-center justify-center text-white font-bold text-lg shadow-sm">O</div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-blue-300 rounded-md flex items-center justify-center text-slate-800 font-bold text-lg shadow-sm">R</div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-slate-100 rounded-md shadow-inner"></div>
<div class="w-12 h-12 bg-brand-primary rounded-md flex items-center justify-center text-white font-bold text-lg shadow-sm">D</div>
</div>
</div>
<!-- Footer Info -->
<div class="text-xs text-slate-400 flex justify-between items-center mt-auto pt-4 border-t border-slate-200/60">
<span>Version 2.4.0</span>
<span>Editor's Choice 2024</span>
</div>
</section>
<!-- END: LeftPane Branding -->
<!-- BEGIN: RightPane Registration Form -->
<section class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-white" data-purpose="registration-form-pane">
<div class="max-w-sm mx-auto w-full">
<!-- Title and Description -->
<div class="mb-10 text-center md:text-left">
<h2 class="text-3xl font-bold text-slate-800 mb-2">Create Your Account</h2>
<p class="text-slate-500 text-sm">Join the ultimate intellectual adventure.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email Address</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg aria-hidden="true" class="h-5 w-5 text-slate-400" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
<path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
</svg>
</div>
<input class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-slate-200 rounded-xl bg-slate-50 py-3 text-slate-900 placeholder-slate-400" id="email" name="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Username Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="username">Username</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg aria-hidden="true" class="h-5 w-5 text-slate-400" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path>
</svg>
</div>
<input class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-slate-200 rounded-xl bg-slate-50 py-3 text-slate-900 placeholder-slate-400" id="username" name="username" placeholder="Choose a username" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg aria-hidden="true" class="h-5 w-5 text-slate-400" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path>
</svg>
</div>
<input class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-slate-200 rounded-xl bg-slate-50 py-3 text-slate-900 placeholder-slate-400" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password Input -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1" for="confirm-password">Confirm Password</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg aria-hidden="true" class="h-5 w-5 text-slate-400" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path>
</svg>
</div>
<input class="focus:ring-brand-primary focus:border-brand-primary block w-full pl-10 sm:text-sm border-slate-200 rounded-xl bg-slate-50 py-3 text-slate-900 placeholder-slate-400" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-3">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-brand-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary transition-colors" type="submit">
              Sign Up
              <svg aria-hidden="true" class="ml-2 -mr-1 h-5 w-5" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</button>
<button class="w-full flex justify-center py-3 px-4 border border-slate-200 rounded-xl shadow-sm text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-300 transition-colors" type="button">
              Back to Login
              <svg class="ml-2 -mr-1 h-5 w-5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
</button>
</div>
</form>
<!-- Social Login Placeholder -->
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-2 bg-white text-slate-400 uppercase tracking-wider">Or sign up with</span>
</div>
</div>
<div class="mt-6 flex justify-center gap-4">
<button class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center hover:bg-slate-50 transition-colors text-slate-600">
<svg class="lucide lucide-facebook" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
</button>
<button class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center hover:bg-slate-50 transition-colors text-slate-600">
<svg class="lucide lucide-chrome" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" x2="12" y1="8" y2="8"></line><line x1="3.95" x2="8.54" y1="6.06" y2="14"></line><line x1="10.88" x2="15.46" y1="21.94" y2="14"></line></svg>
</button>
</div>
</div>
</div>
</section>
<!-- END: RightPane Registration Form -->
</main>
<!-- END: MainContainer -->
</body></html>
